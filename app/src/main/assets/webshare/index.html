<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owl File + Web Share</title>
<style>
  :root {
    --bg-primary: #121212;
    --bg-secondary: #1a1a1a;
    --bg-card: #202020;
    --bg-hover: #2a2a2a;
    --accent: #2dd4bf;
    --accent-hover: #14b8a6;
    --text-primary: #ffffff;
    --text-secondary: #9ca3af;
    --border: #333333;
    --danger: #ef4444;
    --danger-hover: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand svg {
    width: 30px;
    height: 30px;
    fill: var(--accent);
  }
  .brand-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(45, 212, 191, 0.15);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .container {
    flex: 1;
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--bg-secondary);
    padding: 12px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .breadcrumbs {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 14px;
  }
  .crumb {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    padding: 4px 6px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .crumb:hover {
    background: var(--bg-hover);
  }
  .crumb.current {
    color: var(--text-primary);
    font-weight: 600;
    cursor: default;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #000;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--bg-hover); color: var(--text-primary); }
  .search-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    width: 220px;
    transition: width 0.2s, border-color 0.2s;
  }
  .search-box:focus {
    width: 280px;
    border-color: var(--accent);
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    transition: all 0.2s;
    background: rgba(255, 255, 255, 0.01);
  }
  .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(45, 212, 191, 0.08);
    color: var(--accent);
  }
  .file-table-container {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    text-align: left;
  }
  th {
    background: var(--bg-card);
    color: var(--text-secondary);
    font-weight: 600;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  th.sortable {
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, color 0.15s;
  }
  th.sortable:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .sort-indicator {
    display: inline-block;
    margin-left: 4px;
    font-size: 11px;
    color: var(--text-secondary);
    opacity: 0.3;
  }
  th.sorted .sort-indicator {
    opacity: 1;
    color: var(--accent);
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td {
    background: var(--bg-hover);
  }
  .item-row {
    cursor: pointer;
  }
  .item-name-cell {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-primary);
    font-weight: 500;
  }
  .item-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }
  .row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: flex-end;
  }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 6px;
    border-radius: 4px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
  }
  .icon-btn:hover {
    color: var(--text-primary);
    background: var(--bg-card);
  }
  .icon-btn.danger:hover {
    color: var(--danger);
  }
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-content {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 650px;
    width: 100%;
    padding: 24px;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-title {
    font-size: 16px;
    font-weight: 700;
  }
  .media-player-container {
    width: 100%;
    max-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .media-player-container img {
    max-width: 100%;
    max-height: 65vh;
    object-fit: contain;
    border-radius: 6px;
  }
  .media-player-container video, .media-player-container audio {
    width: 100%;
    border-radius: 6px;
  }
  .progress-bar-wrap {
    width: 100%;
    height: 8px;
    background: var(--bg-card);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 12px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.1s;
  }
  .empty-state {
    padding: 48px 16px;
    text-align: center;
    color: var(--text-secondary);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
    <div class="brand-title">Owl File +</div>
    <div class="status-badge"><span class="status-dot"></span> Online</div>
  </div>
  <div style="font-size: 13px; color: var(--text-secondary);" id="phoneModel">Android Storage</div>
</header>

<div class="container">
  <div class="toolbar">
    <div class="breadcrumbs" id="breadcrumbs">
      <span class="crumb" onclick="navigateTo('')">Home</span>
    </div>
    <div class="actions">
      <input type="text" class="search-box" placeholder="Filter files (includes subfolders)..." id="searchInput" oninput="onSearchInput()">
      <button class="btn btn-secondary" onclick="openNewFolderModal()">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/></svg>
        New Folder
      </button>
      <button class="btn btn-secondary" onclick="downloadCurrentFolder()" title="Download current folder as ZIP">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
        Download Folder
      </button>
      <button class="btn" onclick="document.getElementById('fileUploadInput').click()">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
        Upload Files
      </button>
      <input type="file" id="fileUploadInput" multiple style="display:none" onchange="handleFileSelect(event)">
      <button class="btn btn-secondary" onclick="loadDirectory(currentPath)">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </div>

  <div class="dropzone" id="dropzone">
    Drag and drop files here to upload to this directory
  </div>

  <div class="file-table-container">
    <table>
      <thead>
        <tr>
          <th class="sortable sorted" id="th-name" onclick="handleSort('name')">
            Name <span class="sort-indicator" id="sort-icon-name">▲</span>
          </th>
          <th class="sortable" id="th-size" style="width: 120px;" onclick="handleSort('size')">
            Size <span class="sort-indicator" id="sort-icon-size">▲</span>
          </th>
          <th class="sortable" id="th-modified" style="width: 180px;" onclick="handleSort('modified')">
            Modified <span class="sort-indicator" id="sort-icon-modified">▲</span>
          </th>
          <th style="width: 140px; text-align: right;">Actions</th>
        </tr>
      </thead>
      <tbody id="fileTableBody">
        <tr><td colspan="4" class="empty-state">Loading files...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Dialogs -->
<div class="modal-overlay" id="newFolderModal">
  <div class="modal-content" style="max-width: 400px;">
    <div class="modal-header">
      <div class="modal-title">Create New Folder</div>
      <button class="icon-btn" onclick="closeModal('newFolderModal')">&times;</button>
    </div>
    <input type="text" id="newFolderNameInput" class="search-box" style="width: 100%; margin-bottom: 16px;" placeholder="Folder name">
    <div style="display:flex; justify-content:flex-end; gap: 8px;">
      <button class="btn btn-secondary" onclick="closeModal('newFolderModal')">Cancel</button>
      <button class="btn" onclick="submitNewFolder()">Create</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="uploadModal">
  <div class="modal-content" style="max-width: 450px;">
    <div class="modal-header">
      <div class="modal-title" id="uploadStatusTitle">Uploading files...</div>
    </div>
    <div id="uploadFileName" style="font-size: 13px; color: var(--text-secondary); margin-bottom: 8px;"></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="uploadProgressBar"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="previewModal">
  <div class="modal-content" style="max-width: 800px;">
    <div class="modal-header">
      <div class="modal-title" id="previewTitle">File Preview</div>
      <button class="icon-btn" onclick="closeModal('previewModal')">&times;</button>
    </div>
    <div class="media-player-container" id="mediaPreviewContainer"></div>
  </div>
</div>

<script>
  let currentPath = "";
  let cachedItems = [];
  let displayedItems = [];
  let authToken = "";
  let searchDebounceTimer = null;
  let currentSort = { column: 'name', direction: 'asc' };

  const SYSTEM_FOLDER_NAMES = ['android', 'lost.dir', 'system volume information', '$recycle.bin', '__macosx'];

  function isSystemOrHiddenItem(item) {
    if (!item || !item.name) return false;
    if (item.name.startsWith('.')) return true;
    if (item.isDir && SYSTEM_FOLDER_NAMES.includes(item.name.toLowerCase())) return true;
    return false;
  }

  const ICONS = {
    folder: '<svg class="item-icon" fill="#eab308" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>',
    image: '<svg class="item-icon" fill="#38bdf8" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>',
    video: '<svg class="item-icon" fill="#ec4899" viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>',
    audio: '<svg class="item-icon" fill="#a855f7" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>',
    archive: '<svg class="item-icon" fill="#f97316" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.1-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>',
    document: '<svg class="item-icon" fill="#60a5fa" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>',
    file: '<svg class="item-icon" fill="#9ca3af" viewBox="0 0 24 24"><path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/></svg>'
  };

  function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  }

  function formatDate(timestamp) {
    if (!timestamp) return '-';
    const d = new Date(timestamp);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function getIcon(item) {
    if (item.isDir) return ICONS.folder;
    const ext = item.name.split('.').pop().toLowerCase();
    if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'].includes(ext)) return ICONS.image;
    if (['mp4', 'mkv', 'avi', 'mov', 'webm', '3gp'].includes(ext)) return ICONS.video;
    if (['mp3', 'wav', 'ogg', 'flac', 'm4a', 'aac', 'opus'].includes(ext)) return ICONS.audio;
    if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return ICONS.archive;
    if (['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt'].includes(ext)) return ICONS.document;
    return ICONS.file;
  }

  function handleSort(col) {
    if (currentSort.column === col) {
      currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
    } else {
      currentSort.column = col;
      currentSort.direction = (col === 'modified' || col === 'size') ? 'desc' : 'asc';
    }
    updateSortHeaders();
    renderItems(displayedItems);
  }

  function updateSortHeaders() {
    ['name', 'size', 'modified'].forEach(col => {
      const th = document.getElementById('th-' + col);
      const icon = document.getElementById('sort-icon-' + col);
      if (!th || !icon) return;
      if (currentSort.column === col) {
        th.classList.add('sorted');
        icon.textContent = currentSort.direction === 'asc' ? '▲' : '▼';
      } else {
        th.classList.remove('sorted');
        icon.textContent = '▲';
      }
    });
  }

  function sortList(items) {
    if (!items || !items.length) return [];
    const { column, direction } = currentSort;
    const dirFactor = direction === 'asc' ? 1 : -1;

    return [...items].sort((a, b) => {
      // Folders always on top
      if (a.isDir && !b.isDir) return -1;
      if (!a.isDir && b.isDir) return 1;

      let comparison = 0;
      if (column === 'name') {
        comparison = (a.name || '').localeCompare(b.name || '', undefined, { numeric: true, sensitivity: 'base' });
      } else if (column === 'size') {
        comparison = (a.size || 0) - (b.size || 0);
      } else if (column === 'modified') {
        comparison = (a.lastModified || 0) - (b.lastModified || 0);
      }
      return comparison * dirFactor;
    });
  }

  async function loadDirectory(path) {
    currentPath = path;
    const searchInput = document.getElementById('searchInput');
    if (searchInput) searchInput.value = '';
    updateBreadcrumbs(path);
    const tbody = document.getElementById('fileTableBody');
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Loading files...</td></tr>';

    try {
      const res = await fetch('/api/list?path=' + encodeURIComponent(path), {
        headers: authToken ? { 'X-Auth-Token': authToken } : {}
      });
      if (!res.ok) {
        if (res.status === 401) {
          promptPassword();
          return;
        }
        throw new Error('Failed to load directory');
      }
      const data = await res.json();
      cachedItems = (data.items || []).filter(item => !isSystemOrHiddenItem(item));
      displayedItems = [...cachedItems];
      renderItems(displayedItems);
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty-state" style="color:var(--danger)">Error loading directory: ' + e.message + '</td></tr>';
    }
  }

  function promptPassword() {
    const pwd = prompt("This device is password-protected. Please enter password:");
    if (pwd !== null) {
      authToken = pwd;
      loadDirectory(currentPath);
    }
  }

  function renderItems(rawItems) {
    const tbody = document.getElementById('fileTableBody');
    const filteredItems = (rawItems || []).filter(item => !isSystemOrHiddenItem(item));
    const items = sortList(filteredItems);
    const query = (document.getElementById('searchInput')?.value || '').trim();

    if (!items || items.length === 0) {
      tbody.innerHTML = query
        ? `<tr><td colspan="4" class="empty-state">No files found matching "${escapeHtml(query)}"</td></tr>`
        : '<tr><td colspan="4" class="empty-state">This folder is empty</td></tr>';
      return;
    }

    let html = '';
    const isSearching = query.length > 0;
    // Back to parent directory row if not at root and not searching
    if (currentPath !== "" && !isSearching) {
      const parentPath = currentPath.includes('/') ? currentPath.substring(0, currentPath.lastIndexOf('/')) : "";
      html += `
        <tr class="item-row" onclick="navigateTo('${escapeJs(parentPath)}')">
          <td class="item-name-cell">
            <svg class="item-icon" fill="var(--accent)" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <span>.. (Parent Folder)</span>
          </td>
          <td>-</td>
          <td>-</td>
          <td></td>
        </tr>
      `;
    }

    items.forEach(item => {
      const itemPath = item.path || (currentPath ? currentPath + '/' + item.name : item.name);
      const downloadUrl = '/api/download?path=' + encodeURIComponent(itemPath);
      const isMedia = isPreviewable(item.name);
      const isSubfolderItem = isSearching && item.path && item.path.includes('/') && item.path !== (currentPath ? currentPath + '/' + item.name : item.name);

      html += `
        <tr class="item-row">
          <td class="item-name-cell" onclick="${item.isDir ? `navigateTo('${escapeJs(itemPath)}')` : (isMedia ? `previewFile('${escapeJs(item.name)}', '${escapeJs(itemPath)}')` : `downloadFile('${escapeJs(itemPath)}')`)}">
            ${getIcon(item)}
            <div style="display:flex; flex-direction:column; gap:2px; min-width:0; overflow:hidden;">
              <span style="text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">${escapeHtml(item.name)}</span>
              ${isSubfolderItem ? `<span style="font-size:11px; color:var(--text-secondary); opacity:0.8; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">📁 ${escapeHtml(item.path)}</span>` : ''}
            </div>
          </td>
          <td>${item.isDir ? '-' : formatBytes(item.size)}</td>
          <td>${formatDate(item.lastModified)}</td>
          <td>
            <div class="row-actions">
              <a class="icon-btn" href="${downloadUrl}" download title="${item.isDir ? 'Download folder as ZIP' : 'Download file'}" onclick="event.stopPropagation()">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
              </a>
              ${(!item.isDir && isMedia) ? `
                <button class="icon-btn" title="Preview" onclick="event.stopPropagation(); previewFile('${escapeJs(item.name)}', '${escapeJs(itemPath)}')">
                  <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </button>
              ` : ''}
              <button class="icon-btn danger" title="Delete" onclick="event.stopPropagation(); deleteItem('${escapeJs(item.name)}', '${escapeJs(itemPath)}', ${item.isDir})">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  }

  function navigateTo(path) {
    loadDirectory(path);
  }

  function downloadFile(path) {
    window.location.href = '/api/download?path=' + encodeURIComponent(path);
  }

  function downloadCurrentFolder() {
    downloadFile(currentPath);
  }

  function updateBreadcrumbs(path) {
    const container = document.getElementById('breadcrumbs');
    let html = '<span class="crumb" onclick="navigateTo(\'\')">Home</span>';
    if (!path) {
      container.innerHTML = html;
      return;
    }
    const parts = path.split('/');
    let currentAccum = '';
    parts.forEach((p, idx) => {
      currentAccum += (idx > 0 ? '/' : '') + p;
      const isLast = idx === parts.length - 1;
      html += ' <span style="color:var(--text-secondary)">/</span> ';
      if (isLast) {
        html += `<span class="crumb current">${escapeHtml(p)}</span>`;
      } else {
        html += `<span class="crumb" onclick="navigateTo('${currentAccum}')">${escapeHtml(p)}</span>`;
      }
    });
    container.innerHTML = html;
  }

  function onSearchInput() {
    const query = document.getElementById('searchInput').value.trim();

    if (searchDebounceTimer) {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = null;
    }

    if (!query) {
      displayedItems = [...cachedItems];
      renderItems(displayedItems);
      return;
    }

    // Default to searching subfolders recursively
    searchDebounceTimer = setTimeout(() => {
      executeSubfolderSearch(query);
    }, 250);
  }

  async function executeSubfolderSearch(query) {
    const tbody = document.getElementById('fileTableBody');
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Searching subfolders...</td></tr>';

    try {
      const res = await fetch(`/api/search?path=${encodeURIComponent(currentPath)}&q=${encodeURIComponent(query)}`, {
        headers: authToken ? { 'X-Auth-Token': authToken } : {}
      });
      if (!res.ok) {
        if (res.status === 401) {
          promptPassword();
          return;
        }
        throw new Error('Search failed');
      }
      const data = await res.json();
      displayedItems = (data.items || []).filter(item => !isSystemOrHiddenItem(item));
      renderItems(displayedItems);
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty-state" style="color:var(--danger)">Error searching: ' + e.message + '</td></tr>';
    }
  }

  function escapeJs(str) {
    return (str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function isPreviewable(fileName) {
    const ext = fileName.split('.').pop().toLowerCase();
    return ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'mp4', 'webm', 'mp3', 'wav', 'ogg'].includes(ext);
  }

  function previewFile(name, path) {
    const ext = name.split('.').pop().toLowerCase();
    const container = document.getElementById('mediaPreviewContainer');
    document.getElementById('previewTitle').innerText = name;
    const url = '/api/download?path=' + encodeURIComponent(path);

    if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'].includes(ext)) {
      container.innerHTML = `<img src="${url}" alt="${escapeHtml(name)}">`;
    } else if (['mp4', 'webm'].includes(ext)) {
      container.innerHTML = `<video src="${url}" controls autoplay></video>`;
    } else if (['mp3', 'wav', 'ogg'].includes(ext)) {
      container.innerHTML = `<audio src="${url}" controls autoplay style="width: 100%; margin: 20px 0;"></audio>`;
    }

    openModal('previewModal');
  }

  async function deleteItem(name, path, isDir) {
    if (!confirm(`Are you sure you want to delete ${isDir ? 'folder' : 'file'} "${name}"?`)) return;
    try {
      const res = await fetch('/api/delete?path=' + encodeURIComponent(path), {
        method: 'POST',
        headers: authToken ? { 'X-Auth-Token': authToken } : {}
      });
      if (res.ok) {
        loadDirectory(currentPath);
      } else {
        alert('Failed to delete item');
      }
    } catch (e) {
      alert('Error: ' + e.message);
    }
  }

  function openNewFolderModal() {
    document.getElementById('newFolderNameInput').value = '';
    openModal('newFolderModal');
    document.getElementById('newFolderNameInput').focus();
  }

  async function submitNewFolder() {
    const name = document.getElementById('newFolderNameInput').value.trim();
    if (!name) return;
    try {
      const res = await fetch('/api/mkdir?path=' + encodeURIComponent(currentPath) + '&name=' + encodeURIComponent(name), {
        method: 'POST',
        headers: authToken ? { 'X-Auth-Token': authToken } : {}
      });
      if (res.ok) {
        closeModal('newFolderModal');
        loadDirectory(currentPath);
      } else {
        alert('Failed to create folder');
      }
    } catch (e) {
      alert('Error: ' + e.message);
    }
  }

  function handleFileSelect(e) {
    uploadFiles(e.target.files);
  }

  async function uploadFiles(files) {
    if (!files || files.length === 0) return;
    openModal('uploadModal');
    const title = document.getElementById('uploadStatusTitle');
    const nameEl = document.getElementById('uploadFileName');
    const bar = document.getElementById('uploadProgressBar');

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      title.innerText = `Uploading file ${i + 1} of ${files.length}...`;
      nameEl.innerText = `${file.name} (${formatBytes(file.size)})`;
      bar.style.width = '0%';

      await new Promise((resolve, reject) => {
        const uploadUrl = '/api/upload?path=' + encodeURIComponent(currentPath) + '&filename=' + encodeURIComponent(file.name);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', uploadUrl);
        if (authToken) xhr.setRequestHeader('X-Auth-Token', authToken);
        xhr.setRequestHeader('X-File-Name', encodeURIComponent(file.name));

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            bar.style.width = percent + '%';
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve();
          } else {
            reject(new Error('Upload failed with status ' + xhr.status));
          }
        };

        xhr.onerror = () => reject(new Error('Network error during upload'));

        const formData = new FormData();
        formData.append('file', file, file.name);
        xhr.send(formData);
      });
    }

    closeModal('uploadModal');
    loadDirectory(currentPath);
  }

  // Drag and drop support
  const dropzone = document.getElementById('dropzone');
  ['dragenter', 'dragover'].forEach(name => {
    window.addEventListener(name, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); }, false);
  });
  ['dragleave', 'drop'].forEach(name => {
    window.addEventListener(name, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); }, false);
  });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files) {
      uploadFiles(e.dataTransfer.files);
    }
  });

  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) {
    const modal = document.getElementById(id);
    modal.classList.remove('open');
    if (id === 'previewModal') {
      document.getElementById('mediaPreviewContainer').innerHTML = '';
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Initial load
  loadDirectory("");
</script>

</body>
</html>
